{{- if .IsHome -}}
<div class="dock ep-ambient-dock" id="ep-ambient-dock" hidden>
  <div class="dock-inner">
    <button
      type="button"
      class="dock-toggle ep-ambient-toggle"
      id="ep-ambient-toggle"
      aria-label="Mute forest ambience"
      aria-pressed="true"
    >
      <i class="fa-solid fa-volume-high ep-ambient-toggle__icon" id="ep-ambient-toggle-icon" aria-hidden="true"></i>
    </button>
  </div>
</div>
{{- else -}}
<div class="dock" data-dock>
  <div class="dock-inner">
    <div class="dock-panel" data-dock-panel>
      <button type="button" class="dock-action" data-dock-action="back" aria-label="Go back">
        <i class="fa-solid fa-arrow-left text-[0.7rem]"></i>
      </button>
      <span class="dock-divider" aria-hidden="true"></span>
      <button type="button" class="dock-action" data-dock-action="search" aria-label="Search"
              onclick="window.MinimalSearch && window.MinimalSearch.open()">
        <i class="fa-solid fa-magnifying-glass text-[0.7rem]"></i>
      </button>
      <span class="dock-divider" aria-hidden="true"></span>
      <button type="button" class="dock-action" data-dock-action="top" aria-label="Back to top">
        <i class="fa-solid fa-arrow-up text-[0.7rem]"></i>
      </button>
    </div>
    <button type="button" class="dock-toggle" aria-label="Open quick actions" data-dock-toggle>
      <span class="dock-toggle-dots"></span>
    </button>
  </div>
</div>
{{- end -}}
